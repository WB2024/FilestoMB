# FilesToMB web UI. Copy .env.example to .env next to this file and fill it in.
services:
  filestomb:
    image: wb20244/filestomb:latest
    container_name: filestomb
    restart: unless-stopped
    user: "1000:1000"            # matches the owner of the music library and ./config
    network_mode: bridge         # default bridge; avoids allocating a new compose network
    ports:
      - "8097:8000"
    env_file: .env
    volumes:
      # Read-write, only so "Extract here" can unpack archives next to themselves.
      # Everything else FilesToMB does is read-only. Append :ro to forbid
      # extraction; the UI then disables the Extract buttons by itself.
      - /mnt/Main20TB:/music
      - ./config:/config
      # Optional Picard integration: Picard's runtime folder (it holds the remote-command
      # pipe), shared with the picard container. See README. Remove this line and
      # PICARD_PIPE_DIR in .env if you don't use Picard.
      - /opt/picard/run:/picard-run
