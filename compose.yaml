# FilesToMB web UI. Copy .env.example to .env next to this file and fill it in.
services:
  filestomb:
    image: wb20244/filestomb:latest
    container_name: filestomb
    restart: unless-stopped
    user: "1000:1000"            # the owner of your music library and ./config
    ports:
      - "8097:8000"
    env_file: .env
    volumes:
      # Your music. Read-write only so "Extract here" can unpack archives and
      # batch mode can tag files; add :ro to forbid that (Extract then disables itself).
      - /path/to/your/music:/music
      - ./config:/config         # login token, favourites, batch database, audit log
      # Optional Picard integration: Picard's runtime folder (it holds the
      # remote-command pipe), shared with your Picard container. See the README.
      # Remove this line and PICARD_PIPE_DIR in .env if you don't use Picard.
      # - /opt/picard/run:/picard-run
      # Optional ReplayGain: the folder holding the rsgain binary (read-only), then set
      # RSGAIN_PATH=/rsgain/rsgain in .env or under Settings. See README.
      # - /path/to/rsgain-folder:/rsgain:ro
