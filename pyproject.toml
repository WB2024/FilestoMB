[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filestomb"
version = "0.1.0"
description = "A keyboard-driven TUI for turning local albums into MusicBrainz edits"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "textual>=0.60",
    "mutagen>=1.47",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "textual-dev>=1.5",
]

[project.scripts]
filestomb = "filestomb.app:run"

[tool.hatch.build.targets.wheel]
packages = ["src/filestomb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
